<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1620">
<meta name="description" content="Conversación privada con traducción automática entre español y portugués de Brasil">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Chat</title>
<style>
:root{color-scheme:dark;--bg:#0f1620;--panel:#182332;--panel2:#1b2a3b;--line:#2d3a4c;--text:#edf3f8;--muted:#8fa2b4;--accent:#57c7aa;--blue:#508cde;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{outline:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100dvh;min-height:340px;display:flex;align-items:center;justify-content:center}.layout{width:100%;height:100%;max-width:1120px;display:flex;background:var(--bg);overflow:hidden}
.sidebar{width:310px;flex-shrink:0;background:#121e2a;border-right:1px solid var(--line);display:flex;flex-direction:column}.side-head{padding:27px 20px 18px;border-bottom:1px solid var(--line)}.side-head h1{margin:0;font-size:22px;font-weight:680;letter-spacing:-.6px}.side-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.add-chat{width:44px;height:44px;border-radius:15px;background:#28665d;border:1px solid #41947d;color:white;font-size:30px;line-height:1}.add-chat:hover{background:#347e70}.side-head p{color:var(--muted);font-size:12px;margin:7px 0 0}.room-list{flex:1;overflow:auto;padding:9px}.room-item{display:flex;gap:11px;align-items:center;padding:13px 12px;border:0;border-radius:14px;width:100%;background:transparent;text-align:left;color:var(--text);margin:3px 0}.room-item.selected{background:#263648}.room-item:hover{background:#233244}.avatar{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:16px;background:#293e54;color:#a9d6ff;font-weight:700;text-transform:uppercase}.room-item strong{display:block;font-size:14px}.room-item small{display:block;color:var(--muted);margin-top:2px}.side-foot{font-size:12px;color:var(--muted);padding:12px 20px;border-top:1px solid var(--line)}
.chat{display:flex;flex:1;min-width:0;flex-direction:column}.chat-head{min-height:76px;display:flex;align-items:center;gap:12px;padding:15px 24px;border-bottom:1px solid var(--line)}.chat-head h2{font-size:17px;margin:0;letter-spacing:-.2px}.chat-head p{color:var(--muted);font-size:12px;margin:1px 0 0}.grow{flex:1}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:8px 11px}.ghost:hover{color:white;border-color:#73889c}.ghost.danger{color:#f3a4a4}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:26px clamp(15px,4vw,48px);overscroll-behavior:contain}.empty{margin:auto;text-align:center;color:var(--muted);padding:26px;max-width:320px}.empty .symbol{font-size:40px;color:#4b6377;margin-bottom:12px}.bubble{max-width:min(84%,490px);align-self:flex-start;background:#243447;border:1px solid #34485e;border-radius:18px 18px 18px 5px;padding:12px 15px;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 5px 22px #0002}.bubble.mine{align-self:flex-end;background:linear-gradient(145deg,#28665d,#215850);border:1px solid #317969;border-radius:18px 18px 5px 18px}.bubble .meta{margin-top:7px;text-align:right;color:#bacbd3;font-size:10px;white-space:normal}.bubble .original{display:none;margin-top:9px;padding-top:9px;border-top:1px solid #ffffff30;color:#d1e0e8;font-size:12px}.bubble .original.on{display:block}.original-toggle{padding:0;margin:8px 0 0;background:none;color:#cde4eb;font-size:11px;border:0;text-decoration:underline}.composer{display:flex;align-items:end;gap:11px;padding:13px 22px max(13px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#121e2a}.composer textarea{flex:1;resize:none;min-height:46px;max-height:136px;padding:12px 14px;border:1px solid #395168;background:var(--panel);border-radius:14px;color:var(--text);line-height:1.4}.send{background:var(--accent);border:0;color:#072b26;height:46px;padding:0 21px;font-weight:700;border-radius:13px}.status{font-size:12px;color:var(--muted);text-align:center;padding:6px 12px;min-height:25px}
.welcome{width:min(420px,calc(100% - 30px));padding:32px;background:linear-gradient(140deg,#1d3040,#172431);border:1px solid #385064;border-radius:24px;box-shadow:0 24px 60px #0005}.welcome .logo{width:54px;height:54px;display:grid;place-items:center;border:1px solid #416373;background:#243b4a;border-radius:19px;font-size:26px}.welcome h1{font-size:29px;letter-spacing:-.8px;margin:22px 0 6px}.welcome p{color:var(--muted);margin:0 0 26px}.welcome label{color:#cddde7;font-size:13px;display:block;margin-bottom:7px}.welcome input{display:block;width:100%;background:#111d29;color:white;border:1px solid #465f73;border-radius:12px;padding:14px;margin-bottom:14px}.welcome .send{width:100%}.welcome small{display:block;color:var(--muted);margin-top:19px}.error{color:#ffb7b7;font-size:13px;margin:12px 0}.busy{font-size:13px;color:var(--muted)}
.back{display:none}.hidden{display:none!important}
@media(max-width:700px){.layout.admin-list .sidebar{display:flex;width:100%;border:0}.layout.admin-list .chat{display:none}.layout.admin-chat .sidebar{display:none}.layout.admin-chat .chat{display:flex}.back{display:block}.chat-head{padding:12px 14px;min-height:65px}.messages{padding:18px 13px}.composer{padding:10px 12px max(12px,env(safe-area-inset-bottom))}.bubble{max-width:90%}}
@media(min-width:701px){.chat-head .back{display:none}}
</style>
</head>
<body><div id="app"><div class="busy">Conectando…</div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const API='https://zcxvvjjxfhynduyysqvl.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjeHZ2amp4Zmh5bmR1eXlzcXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDA4NDUsImV4cCI6MjEwMjAxNjg0NX0.tPTkUF62cd2tZGLcmBNJLv7AhS24G_tsBx2yE5Ic_LQ';
const db=createClient(API,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=(s,root=document)=>root.querySelector(s);
const app=$('#app');
let user,admin=false,room=null,rooms=[],messages=[],channel=null,watchId=null,openedMobile=false,busy=false;
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function msgError(e){return e?.message||String(e||'Error de conexión')}
function error(text){const e=$('#error');if(e)e.textContent=text;else $('#status')&&( $('#status').textContent=text)}
function formatDate(s){return new Date(s).toLocaleTimeString(admin?'es-ES':'pt-BR',{hour:'2-digit',minute:'2-digit'})}
function claimAdmin(){app.innerHTML='<form class="welcome" id="claimAdmin"><div class="logo">✦</div><h1>Acceso privado</h1><p>Identificación del administrador</p><label for="adminSecret">Clave de administración</label><input type="password" id="adminSecret" autocomplete="off" required placeholder="Clave privada"><button class="send" type="submit">Acceder</button><div class="error" id="error" role="alert"></div><small>Este acceso es exclusivo del propietario.</small></form>';$('#claimAdmin').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const key=$('#adminSecret').value;$('#claimAdmin button').disabled=true;const {data,error:e2}=await db.rpc('chat_v2_claim_admin',{p_secret:key});busy=false;$('#claimAdmin button').disabled=false;if(e2||!data){error(e2?.message||'Clave incorrecta o acceso ya configurado.');return}await showAdmin()};}
function welcome(){app.innerHTML='<form class="welcome" id="welcome"><div class="logo">✦</div><h1>Chat</h1><p>Conversa privada · Tradução automática</p><label for="name">Seu nome</label><input id="name" name="name" maxlength="40" required autocomplete="name" placeholder="Como você se chama?"><button class="send" type="submit">Entrar na conversa</button><div class="error" id="error" role="alert"></div><small>Português (Brasil) ↔ Español</small></form>';
$('#welcome').onsubmit=async e=>{e.preventDefault();if(busy)return;const name=$('#name').value.trim();if(!name)return;busy=true;$('#welcome button').disabled=true;const {data,error:e2}=await db.rpc('chat_v2_register',{p_name:name});busy=false;$('#welcome button').disabled=false;if(e2){error(e2.message);return}await showGuest(data)};
}
function structure(){app.innerHTML='<div class="layout"><aside class="sidebar"><div class="side-head"><div class="side-title"><h1>Conversaciones</h1><button class="add-chat" id="addChat" aria-label="Nueva conversación" title="Nueva conversación">+</button></div><p>Chat privado · Español / Português</p></div><div class="room-list" id="rooms"></div><div class="side-foot">Conversaciones privadas</div></aside><section class="chat"><div class="chat-head"><button class="ghost back" id="back" aria-label="Volver">‹</button><span class="avatar" id="headAvatar">✦</span><div class="grow"><h2 id="headTitle">Chat</h2><p id="headSubtitle">Traducción automática</p></div><button class="ghost danger hidden" id="close">Cerrar acceso</button></div><main class="messages" id="messages" aria-label="Mensajes"></main><div id="status" class="status"></div><form class="composer" id="composer"><textarea id="draft" maxlength="5000" rows="1" placeholder="Escribe un mensaje…" required></textarea><button class="send" id="send" type="submit">Enviar</button></form></section></div>';
$('#composer').onsubmit=send;$('#draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}};$('#back').onclick=()=>{$('.layout').classList.replace('admin-chat','admin-list')};$('#close').onclick=toggleActive;$('#addChat').onclick=newChat;
}
function showHeader(){let title=admin?(room?.guest_name||'Mi chat'):'Chat';
$('#headTitle').textContent=title;$('#headAvatar').textContent=admin?(title.slice(0,1).toUpperCase()||'✦'):'✦';$('#headSubtitle').textContent=admin?'Português do Brasil ↔ Español':'Tradução automática · Português / Español';$('#draft').placeholder=admin?'Escribe tu mensaje…':'Escreva sua mensagem…';$('#send').textContent=admin?'Enviar':'Enviar';$('#close').classList.toggle('hidden',!admin||!room);if(admin&&room)$('#close').textContent=room.active?'Cerrar acceso':'Reabrir acceso';$('#composer').classList.toggle('hidden',!room||!room.active);if(admin&&room&&!room.guest_id){$('#status').textContent='Conversación preparada. Esperando a que la otra persona entre con este nombre.';$('#draft').disabled=true;$('#send').disabled=true}else{$('#draft').disabled=false;$('#send').disabled=false;if($('#status')?.textContent?.startsWith('Conversación preparada.'))$('#status').textContent=''}
}
function renderRooms(){if(!admin)return;const list=$('#rooms');list.replaceChildren();rooms.forEach(r=>{const b=node('button','room-item'+(room?.id===r.id?' selected':''));const av=node('span','avatar',r.guest_name.slice(0,1));const text=node('span');text.append(node('strong','',r.guest_name),node('small','',!r.active?'Acceso cerrado':r.guest_id?'Português (Brasil)':'Esperando conexión'));b.append(av,text);b.onclick=()=>selectRoom(r);list.append(b)})}
function renderMessages(){if(!$('#messages'))return;const container=$('#messages');const wasBottom=container.scrollHeight-container.scrollTop-container.clientHeight<90;container.replaceChildren();
if(!room){const placeholder=node('div','empty');placeholder.append(node('div','symbol','✦'),node('h2','',admin?'Mi chat':'Conversa privada'),node('p','',admin?'Pulsa + para crear una conversación y tenerla preparada antes de que entre la otra persona.':'Conectado'));container.append(placeholder);return}
if(!messages.length){const e=node('div','empty');e.append(node('div','symbol','✦'),node('div','',admin?'Todavía no hay mensajes.':'Ainda não há mensagens.'));container.append(e);return}
for(const m of messages){const mine=m.sender_id===user.id;const translated=!mine&&m.status==='translated'&&m.translated_text;const body=translated?m.translated_text:m.source_text;const b=node('article','bubble'+(mine?' mine':''));b.append(node('div','',body));if(!mine&&!translated&&m.status==='pending')b.append(node('div','meta',admin?'Traduciendo…':'Traduzindo…'));if(!mine&&translated){const toggle=node('button','original-toggle',admin?'Ver original':'Ver original');const original=node('div','original',m.source_text);toggle.onclick=()=>{original.classList.toggle('on');toggle.textContent=original.classList.contains('on')?'Ocultar original':'Ver original'};b.append(toggle,original)}b.append(node('div','meta',formatDate(m.created_at)));container.append(b)}
if(wasBottom||messages.length<15)container.scrollTop=container.scrollHeight;
}
async function newChat(){if(!admin)return;const name=window.prompt('Nombre de la nueva conversación');if(name===null)return;const cleaned=name.trim();if(!cleaned||cleaned.length>40){window.alert('Introduce un nombre de hasta 40 caracteres.');return}const {data,error:e}=await db.rpc('chat_v2_create_room',{p_name:cleaned});if(e){window.alert('No se pudo crear: '+msgError(e));return}await listRooms();const created=rooms.find(r=>r.id===data);if(created)await selectRoom(created);}
async function listRooms(){if(!admin)return;const {data,error:e}=await db.from('chat_v2_rooms').select('id,guest_id,guest_name,active,created_at').order('created_at',{ascending:false});if(e){error(msgError(e));return}rooms=data||[];if(room){const renewed=rooms.find(r=>r.id===room.id);if(renewed)room=renewed}renderRooms();showHeader()}
async function loadMessages(){if(!room)return;const id=room.id;const {data,error:e}=await db.from('chat_v2_messages').select('id,room_id,sender_id,source_lang,source_text,translated_text,status,created_at').eq('room_id',id).order('created_at',{ascending:false}).limit(250);if(room?.id!==id)return;if(e){error(msgError(e));return}messages=(data||[]).reverse();renderMessages()}
async function selectRoom(r){room=r;openedMobile=true;$('.layout').classList.add('admin-chat');$('.layout').classList.remove('admin-list');renderRooms();showHeader();await loadMessages();listenMessages()}
function listenMessages(){if(channel){db.removeChannel(channel);channel=null}if(!room)return;const id=room.id;channel=db.channel('private-chat:'+id).on('postgres_changes',{event:'*',schema:'public',table:'chat_v2_messages',filter:'room_id=eq.'+id},()=>loadMessages()).subscribe();}
async function showAdmin(){admin=true;structure();$('.layout').classList.add('admin-list');await listRooms();if(rooms.length&&window.innerWidth>700)await selectRoom(rooms[0]);else if(!rooms.length){showHeader();renderMessages()}watchId=setInterval(()=>{listRooms();if(room)loadMessages()},7000)}
async function showGuest(id){admin=false;const {data,error:e}=await db.from('chat_v2_rooms').select('id,guest_name,active').eq('id',id).maybeSingle();if(e||!data){welcome();error('Não foi possível abrir a conversa.');return}room=data;structure();$('.sidebar').classList.add('hidden');showHeader();await loadMessages();listenMessages();watchId=setInterval(async()=>{const {data:r}=await db.from('chat_v2_rooms').select('id,guest_name,active').eq('id',id).maybeSingle();if(!r){room=null;$('#composer').classList.add('hidden');$('#status').textContent='Acesso encerrado.';return}room=r;showHeader();await loadMessages()},7000)}
async function send(e){e.preventDefault();if(busy||!room?.active||(admin&&!room.guest_id))return;const text=$('#draft').value.trim();if(!text)return;busy=true;$('#send').disabled=true;$('#draft').value='';const {data,error:e2}=await db.from('chat_v2_messages').insert({room_id:room.id,sender_id:user.id,source_lang:admin?'es':'pt-BR',source_text:text}).select('id').single();busy=false;$('#send').disabled=false;if(e2){$('#draft').value=text;error(msgError(e2));return}$('#status').textContent='';await loadMessages();const {error:tError}=await db.functions.invoke('chat-translate-v2',{body:{message_id:data.id}});if(tError)console.error('Traducción pendiente:',tError);await loadMessages();}
async function toggleActive(){if(!admin||!room)return;const next=!room.active;const {error:e}=await db.from('chat_v2_rooms').update({active:next}).eq('id',room.id);if(e){error(msgError(e));return}room.active=next;await listRooms();showHeader()}
async function init(){try{let {data:{session},error:e}=await db.auth.getSession();if(e)throw e;if(!session){const result=await db.auth.signInAnonymously();if(result.error)throw result.error;session=result.data.session}user=session.user;const {data:owner,error:ownerError}=await db.from('chat_v2_config').select('owner_id').eq('owner_id',user.id).maybeSingle();if(ownerError)throw ownerError;if(owner){await showAdmin();return}const {data:existing,error:guestError}=await db.from('chat_v2_rooms').select('id').eq('guest_id',user.id).maybeSingle();if(guestError)throw guestError;if(existing){await showGuest(existing.id);return}if(new URLSearchParams(location.search).has('admin')){claimAdmin();return}welcome()}catch(e){app.replaceChildren();const box=node('div','welcome');box.append(node('h1','','No se pudo conectar'),node('p','',msgError(e)));const retry=node('button','send','Reintentar');retry.onclick=()=>location.reload();box.append(retry);app.append(box)}}
init();
</script>
</body></html>
